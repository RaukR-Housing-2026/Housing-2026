name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# don't let two pushes deploy at the same time
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # a healthy build takes ~4 min — kill hung runs instead of billing 6h
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # runners default to an Azure apt mirror that sometimes goes down and
      # stalls "Set up R" for 30+ min; point apt at the main archive instead
      - name: Use main Ubuntu archive for apt
        run: sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/apt-mirrors.txt

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # the shinylive Quarto extension shells out to Rscript at render time
      # to bundle the app (no app code is executed during render)
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # shinylive + knitr/rmarkdown run the render; shiny + dplyr are needed
      # because the shinylive bundler resolves the app's dependencies against
      # the local library (the app itself still runs in the visitor's browser).
      # Plain install.packages with RSPM binaries takes ~40s — do NOT swap in
      # setup-r-dependencies: its first uncached run looks hung for 10+ min.
      - name: Install R packages for render
        run: Rscript -e "install.packages(c('shinylive', 'knitr', 'rmarkdown', 'shiny', 'dplyr'))"

      - name: Render site
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
